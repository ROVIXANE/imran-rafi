name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to deploy to GitHub Pages using OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel an in-progress deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Credentials are injected from repository secrets at build time.
      # The committed js/config.js stays empty, so no keys ever enter the repo.
      - name: Generate Supabase runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
        run: |
          python3 - <<'PY'
          import json, os
          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          bucket = os.environ.get("SUPABASE_MEDIA_BUCKET", "").strip() or "portfolio-media"
          config = {
              "supabaseUrl": url,
              "supabaseAnonKey": key,
              "mediaBucket": bucket,
          }
          content = (
              "/* Auto-generated by GitHub Actions. Do not edit or commit. */\n"
              "window.APP_CONFIG = " + json.dumps(config, indent=2, ensure_ascii=False) + ";\n"
          )
          with open("js/config.js", "w", encoding="utf-8") as fh:
              fh.write(content)
          print("Runtime config generated. Supabase configured:", bool(url and key))
          PY

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
