<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d36"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="440" height="440" fill="url(#bg)"/>
  <rect width="440" height="440" fill="url(#grid)"/>
  <circle cx="220" cy="220" r="150" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="220" cy="220" r="122" fill="none" stroke="url(#ring)" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="5 9"/>
  <!-- silhouette -->
  <g fill="#3b82f6" fill-opacity="0.22">
    <circle cx="220" cy="176" r="56"/>
    <path d="M104 386c0-64 52-116 116-116s116 52 116 116z"/>
  </g>
  <g fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="2">
    <circle cx="220" cy="176" r="56"/>
    <path d="M104 386c0-64 52-116 116-116s116 52 116 116z"/>
  </g>
  <g fill="#60a5fa" fill-opacity="0.7">
    <rect x="192" y="170" width="14" height="14" rx="4"/>
    <rect x="234" y="170" width="14" height="14" rx="4"/>
  </g>
  <g transform="translate(0 30)">
    <rect x="128" y="352" width="184" height="34" rx="17" fill="#0a1224" stroke="url(#ring)" stroke-opacity="0.5"/>
    <text x="220" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#93c5fd">YOUR PHOTO HERE</text>
  </g>
</svg>
